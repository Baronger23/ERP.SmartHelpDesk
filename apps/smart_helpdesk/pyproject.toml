[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_helpdesk"
version = "0.1.0"
description = "AIS service operations for ERPNext; no AI runtime"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
smart_helpdesk = ["modules.txt", "patches.txt", "public/**/*", "smart_helpdesk/workspace/**/*"]
